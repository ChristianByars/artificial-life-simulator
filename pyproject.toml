[project]
name = "alife"
version = "0.3.0"
description = "Artificial Life Simulator: pick a life form and watch it simulate in 3D"
requires-python = ">=3.12"
dependencies = [
    "libroadrunner>=2.11.0",
    "numpy>=2.5.4",
    "platformdirs>=4.14.5",
    "ursina>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gui and not slow'"
markers = [
    "gui: opens a window (run with: uv run pytest -m gui)",
    "slow: long headless run (run with: uv run pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "six>=1.17.0",
    "tellurium>=2.2.13.1",
]
